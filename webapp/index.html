<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Паспорт Души</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <base href="/webapp/">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div class="cosmos-bg" aria-hidden="true">
    <div class="cosmos-nebula nebula-1"></div>
    <div class="cosmos-nebula nebula-2"></div>
    <div class="cosmos-nebula nebula-3"></div>
  </div>

  <div id="screen-loading" class="screen">
    <p class="loading-text">Загружаем ваш паспорт…</p>
  </div>

  <div id="screen-error" class="screen hidden">
    <h1>Разбор недоступен</h1>
    <p id="error-text" class="muted"></p>
  </div>

  <div id="screen-cover" class="screen screen-cover hidden">
    <div class="passport-cover-scene">
      <div class="passport-booklet" role="img" aria-label="Обложка паспорта">
        <img class="passport-booklet-img" src="media/passport-cover.jpg" alt="" decoding="async" />
        <div class="passport-leather-mask passport-leather-mask--top" aria-hidden="true"></div>
        <div class="passport-leather-mask passport-leather-mask--bottom" aria-hidden="true"></div>
        <div class="passport-cover-text passport-cover-text--top">
          <p class="cover-title-main">ПАСПОРТ</p>
          <p class="cover-title-sub">Паспорт Души</p>
        </div>
        <div class="passport-cover-text passport-cover-text--bottom">
          <h1 id="cover-name" class="cover-name"></h1>
          <p id="cover-date" class="cover-date"></p>
          <p class="cover-product-label">ДУША</p>
        </div>
      </div>
      <button type="button" id="open-passport-btn" class="btn-cover-open">Открыть паспорт</button>
      <p id="cover-summary" class="cover-summary hidden" hidden></p>
    </div>
  </div>

  <div id="screen-app" class="screen hidden">
    <header class="app-header">
      <button type="button" id="back-cover-btn" class="btn-ghost" aria-label="Назад">←</button>
      <h2 class="app-header-title">Паспорт Души</h2>
    </header>

    <nav class="tab-bar" id="tab-bar" role="tablist"></nav>

    <main id="tab-panel" class="tab-panel" role="tabpanel"></main>
  </div>

  <script src="app.js?v=10"></script>
</body>
</html>
